[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-auditor"
version = "0.1.0"
description = "Rules + robust-statistics auditor for rental listings, with safe auto-fix patches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
listing-auditor = "listing_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
listing_auditor = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
